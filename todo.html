  <meta charset="UTF-8">

  <title>Task Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      overflow: hidden;
    }
  </style>
</head>

    <aside class="w-1/4 bg-white p-4 rounded shadow overflow-y-auto">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Task Summary</h2>

          <span>Completed</span>

        <li class="flex justify-between text-gray-600">
          <span>Overdue</span>
          <span>2</span>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col p-8 overflow-y-auto">
      <!-- Header -->
      <header class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800">Task Management</h1>
        <p class="text-gray-600">Keep track of your tasks effortlessly</p>
      </header>

      <!-- Search, Filter, and Sort -->
      <section class="mb-4">
        <div class="flex items-center gap-4">
          <input 
            type="text" 
            placeholder="Search tasks" 
            class="flex-1 p-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
          <select 
            class="p-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">Filter by Status</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="overdue">Overdue</option>
          </select>
          <select 
            class="p-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">Sort By</option>
            <option value="name">Name</option>
            <option value="created_at">Created Date</option>
            <option value="due_date">Due Date</option>
          </select>
        </div>
      </section>

      <!-- Task List -->
      <section>
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Tasks</h2>
        <div class="grid grid-cols-2 gap-4">
          <div class="p-4 rounded shadow bg-blue-100">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">Task 1</h3>
              <div class="flex gap-2">
                <button class="text-yellow-500" title="In Progress">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                </button>
                <button class="text-green-500" title="Completed">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                </button>
                <button class="text-red-500" title="Overdue">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3" />
                  </svg>
                </button>
              </div>
            </div>
            <p class="text-gray-600">Status: <span class="text-blue-500 font-semibold">Pending</span></p>
          </div>
          <div class="p-4 rounded shadow bg-yellow-100">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">Task 2</h3>
              <div class="flex gap-2">
                <button class="text-green-500" title="Completed">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                </button>
                <button class="text-red-500" title="Overdue">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3" />
                  </svg>
                </button>
              </div>
            </div>
            <p class="text-gray-600">Status: <span class="text-yellow-500 font-semibold">In Progress</span></p>
          </div>
          <div class="p-4 rounded shadow bg-green-100">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">Task 3</h3>
              <div class="flex gap-2">
                <button class="text-red-500" title="Overdue">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3" />
                  </svg>
                </button>
              </div>
            </div>
            <p class="text-gray-600">Status: <span class="text-green-500 font-semibold">Completed</span></p>
          </div>
          <div class="p-4 rounded shadow bg-red-100">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">Task 4</h3>
              <div class="flex gap-2">
                <button class="text-yellow-500" title="In Progress">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                </button>
              </div>
            </div>
            <p class="text-gray-600">Status: <span class="text-red-500 font-semibold">Overdue</span></p>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
